<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .ink{fill:#1b2733}.mut{fill:#5b6b7b}.det{fill:#d62828}.mod{fill:#2a9d8f}
    .lbl{font-size:13px}.sm{font-size:11px}.tt{font-family:'Consolas',monospace}
  </style>
  <rect x="0" y="0" width="920" height="440" fill="#ffffff"/>
  <text x="24" y="34" class="ink" font-size="19" font-weight="700">Grid as a parametric lattice — not pixel hunting</text>
  <text x="24" y="56" class="mut lbl">A semi-log grid (linear x, log₁₀ y) is fully described by a handful of numbers. We fit them, then re-draw every line.</text>

  <!-- ===== Panel A: detected (sparse, occluded) ===== -->
  <g transform="translate(24,80)">
    <rect x="0" y="0" width="250" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="12" y="24" class="ink lbl" font-weight="700">1 · What is visible</text>
    <text x="12" y="42" class="mut sm">decade lines the scan actually sees</text>
    <!-- axis -->
    <line x1="60" y1="60" x2="60" y2="300" stroke="#1b2733" stroke-width="2"/>
    <!-- decade positions y = 70,116,162,208,254,290 -->
    <g class="det">
      <line x1="60" y1="70"  x2="230" y2="70"  stroke="#d62828" stroke-width="2"/>
      <line x1="60" y1="116" x2="230" y2="116" stroke="#d62828" stroke-width="2"/>
      <line x1="60" y1="208" x2="230" y2="208" stroke="#d62828" stroke-width="2"/>
      <line x1="60" y1="254" x2="230" y2="254" stroke="#d62828" stroke-width="2"/>
      <line x1="60" y1="290" x2="230" y2="290" stroke="#d62828" stroke-width="2"/>
    </g>
    <!-- occluding text box swallowing the 4th decade + its minors -->
    <rect x="70" y="150" width="150" height="34" rx="3" fill="#eaf1fb" stroke="#4a86e8" stroke-dasharray="4 3"/>
    <text x="145" y="171" text-anchor="middle" class="sm" fill="#2f6fdd">label / callout</text>
    <text x="70" y="330" class="mut sm">✗ one decade hidden under text</text>
    <!-- decade tick labels -->
    <g class="mut sm" text-anchor="end">
      <text x="54" y="74">10k</text><text x="54" y="120">1k</text>
      <text x="54" y="212">10</text><text x="54" y="258">1</text><text x="54" y="294">.1</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(286,238)"><path d="M0,0 L34,0" stroke="#5b6b7b" stroke-width="2" marker-end="url(#a)"/></g>

  <!-- ===== Panel B: the fit ===== -->
  <g transform="translate(332,80)">
    <rect x="0" y="0" width="270" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="12" y="24" class="ink lbl" font-weight="700">2 · Fit the law (least squares)</text>
    <text x="12" y="42" class="mut sm">two parameters lock the whole axis</text>

    <!-- ruler showing equal decade width W -->
    <line x1="40" y1="70" x2="40" y2="290" stroke="#1b2733" stroke-width="2"/>
    <g stroke="#2a9d8f" stroke-width="2">
      <line x1="40" y1="86"  x2="150" y2="86"/>
      <line x1="40" y1="150" x2="150" y2="150"/>
      <line x1="40" y1="214" x2="150" y2="214"/>
      <line x1="40" y1="278" x2="150" y2="278"/>
    </g>
    <!-- W braces -->
    <g stroke="#5b6b7b" stroke-width="1">
      <line x1="158" y1="86" x2="158" y2="150"/><line x1="154" y1="86" x2="162" y2="86"/><line x1="154" y1="150" x2="162" y2="150"/>
    </g>
    <text x="166" y="122" class="mut sm tt">W (decade)</text>
    <text x="166" y="136" class="mut sm">= const in px</text>

    <!-- formula card -->
    <rect x="12" y="196" width="246" height="112" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="24" y="220" class="ink sm tt">cₖ = anchor + W·(mᵢ + k)</text>
    <text x="24" y="242" class="mut sm">k … decade index (integer)</text>
    <text x="24" y="260" class="mut sm tt">mᵢ = log₁₀(1,2,…9) → minor lines</text>
    <text x="24" y="282" class="mut sm">solve W, anchor to minimise</text>
    <text x="24" y="300" class="mut sm tt">Σ (posₙ − model)²  (outliers dropped)</text>
  </g>

  <!-- arrow -->
  <g transform="translate(614,238)"><path d="M0,0 L34,0" stroke="#5b6b7b" stroke-width="2" marker-end="url(#a)"/></g>

  <!-- ===== Panel C: reconstructed ===== -->
  <g transform="translate(660,80)">
    <rect x="0" y="0" width="236" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="12" y="24" class="ink lbl" font-weight="700">3 · Re-draw everything</text>
    <text x="12" y="42" class="mut sm">every line, at its exact sub-pixel spot</text>
    <line x1="56" y1="60" x2="56" y2="300" stroke="#1b2733" stroke-width="2"/>
    <!-- decades -->
    <g class="mod" stroke="#2a9d8f">
      <line x1="56" y1="70"  x2="216" y2="70"  stroke-width="2"/>
      <line x1="56" y1="116" x2="216" y2="116" stroke-width="2"/>
      <line x1="56" y1="162" x2="216" y2="162" stroke-width="2"/>
      <line x1="56" y1="208" x2="216" y2="208" stroke-width="2"/>
      <line x1="56" y1="254" x2="216" y2="254" stroke-width="2"/>
      <line x1="56" y1="290" x2="216" y2="290" stroke-width="2"/>
    </g>
    <!-- minors (log-spaced within each decade, illustrative) -->
    <g stroke="#8fd3c9" stroke-width="1">
      <line x1="56" y1="84" x2="216" y2="84"/><line x1="56" y1="94" x2="216" y2="94"/><line x1="56" y1="102" x2="216" y2="102"/><line x1="56" y1="108" x2="216" y2="108"/>
      <line x1="56" y1="130" x2="216" y2="130"/><line x1="56" y1="140" x2="216" y2="140"/><line x1="56" y1="148" x2="216" y2="148"/><line x1="56" y1="154" x2="216" y2="154"/>
      <line x1="56" y1="176" x2="216" y2="176"/><line x1="56" y1="186" x2="216" y2="186"/><line x1="56" y1="194" x2="216" y2="194"/><line x1="56" y1="200" x2="216" y2="200"/>
      <line x1="56" y1="222" x2="216" y2="222"/><line x1="56" y1="232" x2="216" y2="232"/><line x1="56" y1="240" x2="216" y2="240"/><line x1="56" y1="246" x2="216" y2="246"/>
    </g>
    <!-- reconstructed-under-text highlight -->
    <rect x="66" y="150" width="140" height="34" rx="3" fill="none" stroke="#4a86e8" stroke-dasharray="4 3"/>
    <text x="66" y="330" class="mod sm">✓ hidden decade restored</text>
  </g>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b6b7b"/>
    </marker>
  </defs>
</svg>
